services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobpilot
      POSTGRES_PASSWORD: jobpilot
      POSTGRES_DB: jobpilot
    ports:
      - "127.0.0.1:${JOBPILOT_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobpilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${JOBPILOT_REDIS_PORT:-6379}:6379"

  backend:
    build: ./backend
    ports:
      - "127.0.0.1:${JOBPILOT_API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://jobpilot:jobpilot@db:5432/jobpilot
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-jobpilot-dev-only-secret-change-me-in-production-123456}
      JOBPILOT_DEMO_ADMIN_PASSWORD: ${JOBPILOT_DEMO_ADMIN_PASSWORD:-Demo@1234}
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:5173","http://127.0.0.1:5173"]}'
      EXTENSION_CLIENT_IDS: '${EXTENSION_CLIENT_IDS:-[]}'
      EXTENSION_WEB_ORIGINS: '${EXTENSION_WEB_ORIGINS:-["http://localhost:5173","http://127.0.0.1:5173"]}'
      # LLM_* intentionally left unset — the AI form runs deterministic mapping only.
      # To enable semantic drafting, add LLM_PROVIDER / LLM_API_KEY / LLM_MODEL / LLM_BASE_URL.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Disabled by default. Start exactly one instance with --profile scheduler
  # after an admin explicitly configures a source schedule (e.g. "every 6h").
  scheduler:
    profiles: [scheduler]
    build: ./backend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://jobpilot:jobpilot@db:5432/jobpilot
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-jobpilot-dev-only-secret-change-me-in-production-123456}
    command: ["python", "-u", "-m", "app.ingestion.scheduler_cli", "--apply", "--watch"]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:${JOBPILOT_WEB_PORT:-5173}:8080"
    depends_on:
      - backend

volumes:
  pgdata:
