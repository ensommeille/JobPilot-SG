name: Security Scans

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  container-scan:
    name: Container scanning (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build backend image
        run: docker build -t jobpilot-backend:scan backend/
      - name: Trivy scan backend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: jobpilot-backend:scan
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-backend.sarif
          trivyignores: ".trivyignore"
      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend.sarif
          category: trivy

  iac-scan:
    name: IaC scanning (Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Checkov
        run: pip install checkov
      - name: Run Checkov (Dockerfiles)
        run: checkov -d . --framework dockerfile --output json --output-file-path . --soft-fail
      - name: Upload Checkov report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-report
          path: results_json.json
          if-no-files-found: ignore

  dast:
    name: DAST (OWASP ZAP baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Start full stack
        run: docker compose up -d --build
      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 3
          done
          curl -fsS http://127.0.0.1:8000/health
      - name: ZAP baseline scan (public /jobs endpoint)
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://127.0.0.1:8000/jobs
          fail_action: warn
          allow_issue_writing: false
          artifact_name: zap-report
