name: CI

on:
  push:
  pull_request:

jobs:
  skeleton:
    name: Repo skeleton validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate required structure
        run: python scripts/check_skeleton.py
      - name: Validate docker-compose
        run: docker compose config -q

  backend-quality:
    name: Backend lint / test / coverage / SAST / deps
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        if: hashFiles('backend/pyproject.toml') != ''
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        if: hashFiles('backend/pyproject.toml') != ''
        run: pip install -e ".[dev]" semgrep pip-audit
      - name: Upgrade pip (dependency-scan toolchain)
        if: hashFiles('backend/pyproject.toml') != ''
        run: python -m pip install --upgrade pip
      - name: Lint (Ruff)
        if: hashFiles('backend/pyproject.toml') != ''
        run: ruff check .
      - name: Unit / API tests + coverage (pytest)
        if: hashFiles('backend/pyproject.toml') != ''
        run: >-
          pytest -q
          --cov=app --cov-branch
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-fail-under=85
      - name: Upload coverage report
        if: ${{ always() && hashFiles('backend/pyproject.toml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore
      - name: SAST (Semgrep)
        if: hashFiles('backend/pyproject.toml') != ''
        run: semgrep --config=auto --error app/
      - name: Dependency scan (pip-audit)
        if: hashFiles('backend/pyproject.toml') != ''
        # Audit the backend project, not Semgrep/pip-audit packages installed only in CI.
        # Semgrep currently pins mcp 1.29.0, which is not a JobPilot dependency.
        run: pip-audit .

  frontend-quality:
    name: Frontend lint / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        if: hashFiles('frontend/package.json') != ''
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        if: hashFiles('frontend/package.json') != ''
        run: npm ci
      - name: Lint (ESLint)
        if: hashFiles('frontend/package.json') != ''
        run: npm run lint
      - name: Type-check and build (tsc + Vite)
        if: hashFiles('frontend/package.json') != ''
        run: npm run build
      - name: Dependency scan (npm audit)
        if: hashFiles('frontend/package.json') != ''
        run: npm audit --audit-level=high

  extension-quality:
    name: Extension safety / browser tests
    runs-on: ubuntu-latest
    env:
      FRONTEND_BASE_URL: http://127.0.0.1:5197
      PLAYWRIGHT_START_FRONTEND: "1"
      VITE_API_BASE_URL: http://127.0.0.1:8001
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - name: Install frontend for isolated browser journeys
        run: npm ci --prefix ../frontend
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm audit --audit-level=high

  docker:
    name: Docker build + deploy smoke check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and start full stack
        run: docker compose up -d --build
      - name: Wait for backend and smoke check API
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 3
          done
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS "http://127.0.0.1:8000/jobs?page=1&page_size=5" | head -c 300
      - name: Smoke check frontend
        run: curl -fsS http://127.0.0.1:5173/ | head -c 100
